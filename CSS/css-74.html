```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Calc</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: calc(100% - 80px);
            margin: auto;
        }

        .box {
            width: calc(50% - 20px);
            padding: 30px;
            background: #101d31;
            border-radius: 15px;
            box-sizing: border-box;
        }

        h1 {
            color: #22d3ee;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CSS calc()</h1>

        <div class="box">
            <h2>Using calc()</h2>
            <p>
                The calc() function performs calculations
                to determine CSS property values.
            </p>
        </div>

    </div>

</body>
</html>
