```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Portfolio</title>

<style>
html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
}

nav {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #101d31;
    padding: 18px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 15px;
}

section {
    padding: 70px 20px;
    text-align: center;
}

#home {
    min-height: 60vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

h1,
h2 {
    color: #22d3ee;
}

.skills {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.skill {
    background: #101d31;
    padding: 20px 35px;
    border-radius: 10px;
}

footer {
    background: #101d31;
    text-align: center;
    padding: 25px;
}

@media (max-width: 600px) {
    nav a {
        display: inline-block;
        margin: 8px;
    }
}
</style>
</head>

<body>

<nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#contact">Contact</a>
</nav>

<section id="home">
    <h1>My Portfolio</h1>
    <p>Welcome to my personal portfolio website.</p>
</section>

<section id="about">
    <h2>About Me</h2>
    <p>I am a student interested in web development and technology.</p>
</section>

<section id="skills">
    <h2>My Skills</h2>

    <div class="skills">
        <div class="skill">HTML</div>
        <div class="skill">CSS</div>
        <div class="skill">JavaScript</div>
    </div>
</section>

<section id="contact">
    <h2>Contact</h2>
    <p>Email: example@gmail.com</p>
</section>

<footer>
    <p>© 2026 My Portfolio</p>
</footer>

</body>
</html>
```
