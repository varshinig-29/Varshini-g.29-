<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>

    <style>
        body {
            margin: 0;
            padding: 50px;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 80px;
            flex-wrap: wrap;
        }

        .box {
            width: 150px;
            height: 150px;
            background: #22d3ee;
            color: #07111f;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .two-d {
            transform: rotate(20deg) scale(1.1);
        }

        .three-d {
            transform: perspective(500px) rotateY(45deg);
        }
    </style>
</head>

<body>

    <h1>2D and 3D Transformations</h1>

    <div class="container">

        <div class="box two-d">
            2D Transform
        </div>

        <div class="box three-d">
            3D Transform
        </div>

    </div>

</body>

</html>
