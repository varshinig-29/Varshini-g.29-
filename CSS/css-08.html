<!DOCTYPE html>
<html>
<head>
    <title>Float and Clear</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        .image {
            float: left;
            width: 150px;
            height: 100px;
            background: #22d3ee;
            margin: 0 20px 10px 0;
        }

        .clear {
            clear: both;
            background: #312e81;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Float Property</h1>

    <div class="image"></div>

    <p>
        This text flows around the floated element.
        The float property allows an element to move
        to the left or right side.
    </p>

    <div class="clear">
        Clear Property
    </div>

</body>
</html>
