```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Homepage</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
}

.hero {
    min-height: 70vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    background: linear-gradient(135deg, #0f2742, #172554);
}

.hero h1 {
    font-size: 50px;
    color: #22d3ee;
}

.hero p {
    font-size: 20px;
}

.destinations {
    padding: 40px 20px;
}

.destinations h2 {
    text-align: center;
    color: #22d3ee;
}

.cards {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.card {
    width: 280px;
    background: #101d31;
    border-radius: 12px;
    overflow: hidden;
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.card div {
    padding: 20px;
}

@media (max-width: 600px) {
    .hero h1 {
        font-size: 35px;
    }
}
</style>
</head>

<body>

<section class="hero">
    <div>
        <h1>Explore the World</h1>
        <p>Discover amazing destinations and unforgettable experiences.</p>
    </div>
</section>

<section class="destinations">
    <h2>Popular Destinations</h2>

    <div class="cards">
        <div class="card">
            <img src="https://picsum.photos/400/250?5" alt="Destination">
            <div>
                <h3>Paris</h3>
                <p>Experience art, culture and history.</p>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/400/250?6" alt="Destination">
            <div>
                <h3>Maldives</h3>
                <p>Enjoy beautiful beaches and nature.</p>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/400/250?7" alt="Destination">
            <div>
                <h3>Dubai</h3>
                <p>Explore modern architecture and luxury.</p>
            </div>
        </div>
    </div>
</section>

</body>
</html>
```
