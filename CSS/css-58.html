```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Spinner</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #07111f;
    display: flex;
    justify-content: center;
    align-items: center;
}

.spinner {
    width: 70px;
    height: 70px;
    border: 8px solid #101d31;
    border-top: 8px solid #22d3ee;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="spinner"></div>

</body>
</html>
