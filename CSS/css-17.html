<!DOCTYPE html>
<html>
<head>
    <title>Transitions and Transformations</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 60px;
        }

        .box {
            width: 150px;
            height: 150px;
            margin: 50px auto;
            background: #7c3aed;

            transition: transform 0.5s;
        }

        .box:hover {
            transform: scale(1.3) rotate(10deg);
        }
    </style>
</head>

<body>

    <h1>Transitions and Transformations</h1>

    <div class="box"></div>

</body>
</html>
