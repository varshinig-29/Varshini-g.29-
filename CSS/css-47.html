```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Shopping</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
}

header {
    background: #101d31;
    padding: 25px;
    text-align: center;
}

header h1 {
    color: #22d3ee;
}

.products {
    padding: 40px 20px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.product {
    background: #101d31;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
}

.product img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
}

.product h3 {
    color: #22d3ee;
}

button {
    padding: 10px 20px;
    background: #22d3ee;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

@media (max-width: 900px) {
    .products {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 500px) {
    .products {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>ShopZone</h1>
    <p>Simple Online Shopping Website</p>
</header>

<section class="products">

    <div class="product">
        <img src="https://picsum.photos/300/200?1" alt="Product">
        <h3>Smart Watch</h3>
        <p>₹1,999</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://picsum.photos/300/200?2" alt="Product">
        <h3>Headphones</h3>
        <p>₹1,499</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://picsum.photos/300/200?3" alt="Product">
        <h3>Backpack</h3>
        <p>₹999</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://picsum.photos/300/200?4" alt="Product">
        <h3>Sunglasses</h3>
        <p>₹799</p>
        <button>Buy Now</button>
    </div>

</section>

</body>
</html>
