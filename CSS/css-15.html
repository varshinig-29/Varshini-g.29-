<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .box {
            padding: 50px;
            text-align: center;
            background: #312e81;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <h1>CSS Grid Layout</h1>

    <div class="container">

        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>
        <div class="box">Box 5</div>
        <div class="box">Box 6</div>

    </div>

</body>
</html>
