<!DOCTYPE html>
<html>
<head>
    <title>Width Height Sizing</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        .fixed {
            width: 300px;
            height: 100px;
            background: #172554;
            margin-bottom: 20px;
        }

        .percentage {
            width: 70%;
            height: 100px;
            background: #312e81;
            margin-bottom: 20px;
        }

        .minimum {
            min-width: 250px;
            max-width: 600px;
            height: 100px;
            background: #155e75;
        }
    </style>
</head>

<body>

    <h1>Width and Height</h1>

    <div class="fixed">Fixed Width and Height</div>

    <div class="percentage">Percentage Width</div>

    <div class="minimum">Minimum and Maximum Width</div>

</body>
</html>
