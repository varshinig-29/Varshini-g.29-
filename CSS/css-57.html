```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyframe Animation</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #07111f;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.box {
    width: 120px;
    height: 120px;
    background: #22d3ee;
    border-radius: 15px;
    animation: moveBox 3s infinite alternate;
}

@keyframes moveBox {
    0% {
        transform: translateX(-150px) rotate(0deg);
    }

    50% {
        transform: translateX(0) rotate(180deg);
    }

    100% {
        transform: translateX(150px) rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="box"></div>

</body>
</html>
