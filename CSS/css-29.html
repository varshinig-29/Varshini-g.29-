```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CSS Variables</title>

    <style>

        :root {
            --main-color: #22d3ee;
            --background-color: #07111f;
            --card-color: #101d31;
            --text-color: white;
        }

        body {
            margin: 0;
            background: var(--background-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px;
        }

        .card {
            background: var(--card-color);
            padding: 40px;
            border-radius: 15px;
        }

        h1 {
            color: var(--main-color);
        }

        button {
            background: var(--main-color);
            padding: 12px 25px;
            border: none;
        }

    </style>
</head>

<body>

    <div class="card">

        <h1>CSS Variables</h1>

        <p>CSS custom properties are used in this webpage.</p>

        <button>Learn More</button>

    </div>

</body>

</html>
