```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #101d31;
            padding: 40px;
            width: 320px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            color: #22d3ee;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #22d3ee;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Login</h1>

        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">

        <button>Login</button>

    </div>

</body>

</html>
