```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliding Card Animation</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #07111f;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 300px;
    background: #101d31;
    border-radius: 15px;
    overflow: hidden;
    animation: slideIn 1.5s ease-out;
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.card-content {
    padding: 20px;
    color: white;
}

.card h2 {
    color: #22d3ee;
}

@keyframes slideIn {
    from {
        transform: translateX(-400px);
        opacity: 0;
    }

    to {
        transform: translateX(0);
        opacity: 1;
    }
}
</style>
</head>

<body>

<div class="card">

    <img src="https://picsum.photos/400/250" alt="Sample Image">

    <div class="card-content">
        <h2>Animated Card</h2>
        <p>This card slides into the page using CSS animation.</p>
    </div>

</div>

</body>
</html>
```
