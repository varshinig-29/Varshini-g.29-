<!DOCTYPE html>
<html>
<head>
    <title>Responsive Webpage</title>

    <style>
        body {
            margin: 0;
            background: #07111f;
            color: white;
            font-family: Arial;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 40px;
        }

        .box {
            flex: 1;
            padding: 50px;
            text-align: center;
            background: #312e81;
            border-radius: 15px;
        }

        /* Responsive design */
        @media (max-width: 700px) {

            .container {
                flex-direction: column;
                padding: 20px;
            }

            .box {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <h1 style="text-align:center;">Responsive Webpage</h1>

    <div class="container">

        <div class="box">Section 1</div>

        <div class="box">Section 2</div>

        <div class="box">Section 3</div>

    </div>

</body>
</html>
