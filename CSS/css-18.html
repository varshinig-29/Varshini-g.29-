<!DOCTYPE html>
<html>
<head>
    <title>CSS Animation</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        .box {
            width: 120px;
            height: 120px;
            background: #22d3ee;
            margin: 80px auto;

            animation: moveBox 3s infinite alternate;
        }

        @keyframes moveBox {

            from {
                transform: translateX(-150px);
            }

            to {
                transform: translateX(150px);
            }
        }
    </style>
</head>

<body>

    <h1>CSS Animation</h1>

    <div class="box"></div>

</body>
</html>
