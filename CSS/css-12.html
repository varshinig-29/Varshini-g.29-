<!DOCTYPE html>
<html>
<head>
    <title>CSS Lists and Tables</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        ul {
            list-style-type: square;
        }

        li {
            margin: 10px;
            color: #67e8f9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th, td {
            border: 1px solid #22d3ee;
            padding: 15px;
            text-align: center;
        }

        th {
            background: #312e81;
        }

        td {
            background: #101d31;
        }
    </style>
</head>

<body>

    <h1>CSS Lists</h1>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h1>CSS Table</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>Student 1</td>
            <td>Web Development</td>
        </tr>

        <tr>
            <td>Student 2</td>
            <td>Web Design</td>
        </tr>
    </table>

</body>
</html>
