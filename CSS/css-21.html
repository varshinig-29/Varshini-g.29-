<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        body {
            margin: 0;
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        .profile {
            max-width: 700px;
            margin: auto;
            padding: 40px;
            background: #101d31;
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            color: #67e8f9;
        }

        h2 {
            color: #a78bfa;
        }

        p {
            color: #cbd5e1;
            line-height: 1.8;
        }

        .details {
            text-align: left;
            margin-top: 30px;
        }

        .details p {
            padding: 10px;
            border-bottom: 1px solid #334155;
        }
    </style>
</head>

<body>

    <div class="profile">

        <h1>Student Profile</h1>

        <h2>Navya</h2>

        <div class="details">

            <p><strong>Course:</strong> Computer Science</p>

            <p><strong>College:</strong> ABC College</p>

            <p><strong>Year:</strong> 3rd Year</p>

            <p><strong>Department:</strong> Computer Science</p>

            <p><strong>Email:</strong> student@example.com</p>

        </div>

    </div>

</body>
</html>
