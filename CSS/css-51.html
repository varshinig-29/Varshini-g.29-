```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Template Areas</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
}

.container {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 80px 1fr 70px;
    grid-template-areas:
        "header header"
        "sidebar main"
        "footer footer";
}

header {
    grid-area: header;
    background: #101d31;
    display: flex;
    align-items: center;
    justify-content: center;
}

aside {
    grid-area: sidebar;
    background: #17243a;
    padding: 25px;
}

main {
    grid-area: main;
    padding: 30px;
}

footer {
    grid-area: footer;
    background: #101d31;
    display: flex;
    align-items: center;
    justify-content: center;
}

h1,
h2 {
    color: #22d3ee;
}

@media (max-width: 600px) {
    .container {
        grid-template-columns: 1fr;
        grid-template-rows: 80px auto 1fr 70px;
        grid-template-areas:
            "header"
            "sidebar"
            "main"
            "footer";
    }
}
</style>
</head>

<body>

<div class="container">

    <header>
        <h1>My Website</h1>
    </header>

    <aside>
        <h2>Menu</h2>
        <p>Home</p>
        <p>About</p>
        <p>Contact</p>
    </aside>

    <main>
        <h2>Welcome</h2>
        <p>This layout uses CSS Grid Template Areas.</p>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</div>

</body>
</html>
```
