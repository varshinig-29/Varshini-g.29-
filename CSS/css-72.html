```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Typography</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            color: #22d3ee;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Typography</h1>
    <p>
        The text size changes automatically according to the screen size.
    </p>

</body>
</html>
```
