<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        .box {
            width: 300px;

            /* Content */
            height: 150px;

            /* Padding */
            padding: 30px;

            /* Border */
            border: 5px solid #22d3ee;

            /* Margin */
            margin: 50px auto;

            background: #172554;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        Content Area
    </div>

</body>
</html>
