```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D and 3D Transforms</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #07111f;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 80px;
    flex-wrap: wrap;
}

.box {
    width: 150px;
    height: 150px;
    background: #101d31;
    border: 2px solid #22d3ee;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 10px;
    transition: 0.6s;
}

.two-d:hover {
    transform: rotate(45deg) scale(1.2);
}

.three-d {
    perspective: 600px;
}

.three-d:hover {
    transform: rotateY(180deg);
}
</style>
</head>

<body>

<div class="box two-d">
    2D Transform
</div>

<div class="box three-d">
    3D Transform
</div>

</body>
</html>
