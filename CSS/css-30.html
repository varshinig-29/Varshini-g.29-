```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Background Images</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
        }

        .top {
            height: 300px;
            background-image: url("https://picsum.photos/1200/500?1");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bottom {
            height: 300px;
            background-image: url("https://picsum.photos/1200/500?2");
            background-size: cover;
            background-position: top right;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
        }

    </style>
</head>

<body>

    <div class="top">
        <h1>Background Position: Center</h1>
    </div>

    <div class="bottom">
        <h1>Background Position: Top Right</h1>
    </div>

</body>

</html>
