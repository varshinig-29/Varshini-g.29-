```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Typography</title>

<style>
body {
    margin: 0;
    background: #07111f;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 50px 20px;
}

h1 {
    font-size: 8vw;
    color: #22d3ee;
}

h2 {
    font-size: 5vw;
}

p {
    font-size: 2vw;
    color: #cbd5e1;
}

@media (max-width: 600px) {
    h1 {
        font-size: 12vw;
    }

    h2 {
        font-size: 8vw;
    }

    p {
        font-size: 5vw;
    }
}
</style>
</head>

<body>

<h1>Responsive Typography</h1>
<h2>CSS Text Scaling</h2>
<p>The text size changes according to the screen size.</p>

</body>
</html>
```
