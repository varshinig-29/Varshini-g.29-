```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CSS Selectors</title>

    <style>

        /* Universal Selector */
        * {
            box-sizing: border-box;
        }

        /* Element Selector */
        h1 {
            color: cyan;
        }

        /* Class Selector */
        .highlight {
            color: yellow;
        }

        /* ID Selector */
        #special {
            color: pink;
        }

        /* Attribute Selector */
        input[type="text"] {
            border: 2px solid cyan;
            padding: 10px;
        }

        /* Grouping Selector */
        h2, p {
            font-family: Arial, sans-serif;
        }

    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <h2 class="highlight">Class Selector</h2>

    <p id="special">ID Selector</p>

    <p>Element and grouping selectors.</p>

    <input type="text" placeholder="Attribute Selector">

</body>

</html>
