```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Transitions</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #07111f;
    font-family: Arial, sans-serif;
}

.box {
    width: 180px;
    height: 180px;
    background: #22d3ee;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #07111f;
    font-weight: bold;

    transition:
        width 0.5s,
        height 0.5s,
        transform 0.5s,
        border-radius 0.5s;
}

.box:hover {
    width: 240px;
    height: 240px;
    transform: rotate(10deg);
    border-radius: 50%;
}
</style>
</head>

<body>

<div class="box">
    Hover Me
</div>

</body>
</html>
