```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .gallery div {
            width: 200px;
        }

        img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        .blur {
            filter: blur(4px);
        }

        .grayscale {
            filter: grayscale(100%);
        }

        .brightness {
            filter: brightness(150%);
        }

        .contrast {
            filter: contrast(180%);
        }
    </style>
</head>

<body>

    <h1>CSS Filters</h1>

    <div class="gallery">

        <div>
            <p>Blur</p>
            <img class="blur" src="https://picsum.photos/300/200?1">
        </div>

        <div>
            <p>Grayscale</p>
            <img class="grayscale" src="https://picsum.photos/300/200?2">
        </div>

        <div>
            <p>Brightness</p>
            <img class="brightness" src="https://picsum.photos/300/200?3">
        </div>

        <div>
            <p>Contrast</p>
            <img class="contrast" src="https://picsum.photos/300/200?4">
        </div>

    </div>

</body>
</html>
