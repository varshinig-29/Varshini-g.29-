<!DOCTYPE html>
<html>
<head>
    <title>Inline, Internal and External CSS</title>

    <!-- Internal CSS -->
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        .internal {
            color: #a78bfa;
            font-size: 24px;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 style="color: #f472b6;">Inline CSS</h1>

    <h2 class="internal">Internal CSS</h2>

    <h3 class="external">External CSS</h3>

</body>
</html>
