```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #07111f;
            margin: 0;
            padding: 50px;
        }

        .card {
            width: 280px;
            margin: auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .card h2 {
            color: #111827;
        }

        .price {
            color: #2563eb;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="https://via.placeholder.com/280x200" alt="Product">

        <div class="card-content">
            <h2>Smart Watch</h2>
            <p>Modern smart watch with useful features.</p>
            <p class="price">₹2,999</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>

</html>
```
