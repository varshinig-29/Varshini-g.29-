<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>

    <style>
        body {
            margin: 0;
            background: #07111f;
            font-family: Arial;
        }

        nav {
            background: #101d31;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: #22d3ee;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
