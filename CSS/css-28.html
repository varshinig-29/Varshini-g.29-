```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Combinator Selectors</title>

    <style>

        /* Descendant Selector */
        .parent p {
            color: cyan;
        }

        /* Child Selector */
        .parent > h2 {
            color: yellow;
        }

        /* Adjacent Sibling Selector */
        h3 + p {
            color: pink;
        }

        /* General Sibling Selector */
        h4 ~ p {
            background: #222;
            padding: 10px;
        }

    </style>
</head>

<body>

    <div class="parent">

        <h2>Child Selector</h2>

        <div>
            <p>Descendant Selector</p>
        </div>

    </div>

    <h3>Adjacent Sibling</h3>
    <p>This is immediately after h3.</p>

    <h4>General Sibling</h4>
    <p>General sibling paragraph 1.</p>
    <p>General sibling paragraph 2.</p>

</body>

</html>
