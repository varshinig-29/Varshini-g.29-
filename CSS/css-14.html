<!DOCTYPE html>
<html>
<head>
    <title>CSS Flexbox</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 300px;
            background: #101d31;
        }

        .box {
            width: 150px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #312e81;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <h1>CSS Flexbox</h1>

    <div class="container">

        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>

    </div>

</body>
</html>
