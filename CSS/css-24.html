```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #07111f;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            color: white;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <h1>Photo Gallery</h1>

    <div class="gallery">
        <img src="https://picsum.photos/400/300?1" alt="Photo 1">
        <img src="https://picsum.photos/400/300?2" alt="Photo 2">
        <img src="https://picsum.photos/400/300?3" alt="Photo 3">
        <img src="https://picsum.photos/400/300?4" alt="Photo 4">
        <img src="https://picsum.photos/400/300?5" alt="Photo 5">
        <img src="https://picsum.photos/400/300?6" alt="Photo 6">
    </div>

</body>

</html>
