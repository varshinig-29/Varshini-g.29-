<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CSS Selectors</title>

<style>

body {
    font-family: Arial;
    background: #020617;
    color: white;
    padding: 30px;
}

h1 {
    color: #a78bfa;
}

.demo {
    padding: 20px;
    background: #312e81;
    margin: 15px;
    border-radius: 15px;
}

/* Element Selector */

p {
    color: #60a5fa;
}

/* Class Selector */

.highlight {
    background: #7c3aed;
    padding: 15px;
}

/* ID Selector */

#special {
    color: #fbbf24;
    font-size: 25px;
}

/* Attribute Selector */

input[type="text"] {
    border: 3px solid #8b5cf6;
    padding: 10px;
}

</style>

</head>

<body>

<div class="demo">

<h1>CSS Selectors</h1>

<p>
Element Selector
</p>

<p class="highlight">
Class Selector
</p>

<p id="special">
ID Selector
</p>

<input
type="text"
placeholder="Attribute selector">

<br><br>

<a href="../index.html"
style="color:white;">
Home
</a>

</div>

</body>

</html>
