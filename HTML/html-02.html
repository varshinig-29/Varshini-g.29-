<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            color: white;
            background: linear-gradient(135deg, #020617, #312e81);
            min-height: 100vh;
        }

        nav {
            padding: 18px;
            background: #0f172a;
            display: flex;
            justify-content: space-between;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        li {
            margin: 10px;
        }
    </style>
</head>

<body>

<nav>
    <b>⭐ HTML Lists</b>

    <div>
        <a href="../index.html">Home</a>
        <a href="index.html">Programs</a>
    </div>
</nav>

<div class="container">

    <div class="card">

        <h1>HTML Lists</h1>

        <h2>Ordered List</h2>

        <ol>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>Python</li>
        </ol>

    </div>

    <div class="card">

        <h2>Unordered List</h2>

        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Mango</li>
            <li>Orange</li>
        </ul>

    </div>

    <div class="card">

        <h2>Description List</h2>

        <dl>
            <dt><b>HTML</b></dt>
            <dd>Structure of webpage</dd>

            <dt><b>CSS</b></dt>
            <dd>Styling of webpage</dd>

            <dt><b>JavaScript</b></dt>
            <dd>Behavior of webpage</dd>
        </dl>

    </div>

</div>

</body>
</html>
