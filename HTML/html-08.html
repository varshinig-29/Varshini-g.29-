<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Semantic HTML</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #020617;
    color: white;
}

header, nav, section, article, aside, footer {
    padding: 25px;
    margin: 10px;
    border-radius: 15px;
}

header {
    background: #4f46e5;
}

nav {
    background: #312e81;
}

section {
    background: #1e293b;
}

article {
    background: #334155;
}

aside {
    background: #475569;
}

footer {
    background: #111827;
    text-align: center;
}

a {
    color: white;
    margin-right: 20px;
}

</style>

</head>

<body>

<header>

<h1>My Website</h1>

<p>Semantic HTML Example</p>

</header>

<nav>

<a href="../index.html">Home</a>

<a href="#">About</a>

<a href="#">Contact</a>

</nav>

<section>

<h2>About HTML</h2>

<article>

<h3>What is HTML?</h3>

<p>
HTML is used to structure webpages.
</p>

</article>

<aside>

<h3>Related Information</h3>

<p>HTML5 provides semantic elements.</p>

</aside>

</section>

<footer>

<p>© 2026 My Website</p>

</footer>

</body>

</html>
