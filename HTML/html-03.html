<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Tables</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            color: white;
            background: linear-gradient(135deg, #020617, #172554);
            min-height: 100vh;
        }

        nav {
            padding: 18px;
            background: #0f172a;
            display: flex;
            justify-content: space-between;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid white;
            padding: 15px;
            text-align: center;
        }

        th {
            background: #4f46e5;
        }

        tr:hover {
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>

<body>

<nav>
    <b>⭐ HTML Tables</b>

    <div>
        <a href="../index.html">Home</a>
        <a href="index.html">Programs</a>
    </div>
</nav>

<div class="container">

    <div class="card">

        <h1>Student Marks Table</h1>

        <table>

            <tr>
                <th>Name</th>
                <th>Roll No</th>
                <th>HTML</th>
                <th>CSS</th>
                <th>JavaScript</th>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>101</td>
                <td>90</td>
                <td>85</td>
                <td>88</td>
            </tr>

            <tr>
                <td>Priya</td>
                <td>102</td>
                <td>95</td>
                <td>90</td>
                <td>92</td>
            </tr>

            <tr>
                <td>Arjun</td>
                <td>103</td>
                <td>80</td>
                <td>85</td>
                <td>87</td>
            </tr>

        </table>

    </div>

</div>

</body>
</html>
