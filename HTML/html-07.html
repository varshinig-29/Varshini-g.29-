<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>HTML Iframe</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg,#020617,#1e1b4b);
    color: white;
}

nav {
    padding: 18px;
    background: #0f172a;
    display: flex;
    justify-content: space-between;
}

nav a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 1000px;
    margin: 50px auto;
    padding: 20px;
}

.card {
    padding: 30px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
}

iframe {
    width: 100%;
    height: 400px;
    border: 2px solid #8b5cf6;
    border-radius: 15px;
}

</style>

</head>

<body>

<nav>

<b>⭐ Iframe Example</b>

<a href="../index.html">Home</a>

</nav>

<div class="container">

<div class="card">

<h1>Embedded Webpage</h1>

<iframe
src="https://www.wikipedia.org/"
title="Wikipedia">

</iframe>

</div>

</div>

</body>

</html>
