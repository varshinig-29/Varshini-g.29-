<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>HTML5 Input Types</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg,#020617,#312e81);
    color: white;
}

nav {
    padding: 18px;
    background: #0f172a;
    display: flex;
    justify-content: space-between;
}

nav a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 600px;
    margin: 40px auto;
}

.card {
    padding: 30px;
    background: rgba(255,255,255,.1);
    border-radius: 20px;
}

label {
    display: block;
    margin-top: 15px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin-top: 5px;
}

</style>

</head>

<body>

<nav>

<b>⭐ HTML5 Input Types</b>

<a href="../index.html">Home</a>

</nav>

<div class="container">

<div class="card">

<h1>HTML5 Input Types</h1>

<form>

<label>Email</label>
<input type="email"
placeholder="example@gmail.com">

<label>Date</label>
<input type="date">

<label>Number</label>
<input type="number"
min="1"
max="100">

<label>Password</label>
<input type="password">

<label>Color</label>
<input type="color">

<label>Range</label>
<input type="range">

<label>Search</label>
<input type="search"
placeholder="Search">

<label>URL</label>
<input type="url"
placeholder="https://example.com">

</form>

</div>

</div>

</body>

</html>
