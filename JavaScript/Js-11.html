<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 11 - Sum of Digits</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background:
                radial-gradient(circle at top left, #172554, transparent 35%),
                radial-gradient(circle at bottom right, #3b0764, transparent 35%),
                #020617;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(34, 211, 238, 0.25);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        h1 { color: #f7df1e; margin-bottom: 15px; }
        h2 { color: #22d3ee; margin-bottom: 20px; }

        .result {
            padding: 20px;
            background: rgba(30,41,59,0.8);
            border: 1px solid rgba(139,92,246,0.4);
            border-radius: 12px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>JavaScript Laboratory</h1>
    <h2>Experiment 11 - Sum of Digits</h2>

    <div class="result">
        <script>
            let number = 12345;
            let sum = 0;

            while (number > 0) {
                let digit = number % 10;
                sum = sum + digit;
                number = Math.floor(number / 10);
            }

            document.write("Sum of digits = " + sum);
        </script>
    </div>

</div>

</body>
</html>
