<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 14 - Array Average</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top left, #172554, transparent 35%),
                radial-gradient(circle at bottom right, #3b0764, transparent 35%),
                #020617;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 750px;
            padding: 40px;
            text-align: center;
            background: rgba(15,23,42,0.92);
            border: 1px solid rgba(34,211,238,0.25);
            border-radius: 20px;
        }

        h1 { color: #f7df1e; margin-bottom: 15px; }
        h2 { color: #22d3ee; margin-bottom: 20px; }

        .result {
            padding: 20px;
            background: rgba(30,41,59,0.8);
            border-radius: 12px;
            font-size: 18px;
            line-height: 2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>JavaScript Laboratory</h1>
    <h2>Experiment 14 - Sum & Average</h2>

    <div class="result">

        <script>
            let numbers = [10, 20, 30, 40, 50];

            let sum = 0;

            for (let number of numbers) {
                sum = sum + number;
            }

            let average = sum / numbers.length;

            document.write("Array = " + numbers.join(", ") + "<br>");
            document.write("Sum = " + sum + "<br>");
            document.write("Average = " + average);
        </script>

    </div>

</div>

</body>
</html>
