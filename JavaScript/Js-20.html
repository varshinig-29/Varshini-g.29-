<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Date and Math Objects</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;

            background:
                radial-gradient(circle at top left, #172554, transparent 35%),
                radial-gradient(circle at bottom right, #3b0764, transparent 35%),
                #020617;

            color: white;
        }

        .container {
            width: 90%;
            max-width: 750px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(34, 211, 238, 0.25);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #f7df1e;
            margin-bottom: 12px;
            font-size: 32px;
        }

        h2 {
            color: #22d3ee;
            margin-bottom: 25px;
        }

        .result {
            padding: 22px;

            background: rgba(30, 41, 59, 0.8);

            border: 1px solid rgba(139, 92, 246, 0.4);

            border-radius: 12px;

            color: #e2e8f0;

            font-size: 18px;

            line-height: 2;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>JavaScript Laboratory</h1>

        <h2>20. Date and Math Objects</h2>

        <div class="result" id="result"></div>

    </div>

    <script>
        let today = new Date();

        let currentDate = today.toDateString();

        let currentTime = today.toLocaleTimeString();

        let randomNumber = Math.random();

        let squareRoot = Math.sqrt(64);

        let power = Math.pow(2, 3);

        let maximum = Math.max(10, 25, 15, 40);

        let minimum = Math.min(10, 25, 15, 40);

        document.getElementById("result").innerHTML =
            "Current Date = " + currentDate + "<br>" +
            "Current Time = " + currentTime + "<br>" +
            "Random Number = " + randomNumber + "<br>" +
            "Square Root of 64 = " + squareRoot + "<br>" +
            "2 Power 3 = " + power + "<br>" +
            "Maximum Number = " + maximum + "<br>" +
            "Minimum Number = " + minimum;
    </script>

</body>
</html>
