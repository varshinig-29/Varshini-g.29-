<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;

            background:
                radial-gradient(circle at top left, #172554, transparent 35%),
                radial-gradient(circle at bottom right, #3b0764, transparent 35%),
                #020617;

            color: white;
        }

        .container {
            width: 90%;
            max-width: 750px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(34, 211, 238, 0.25);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: #f7df1e;
            margin-bottom: 12px;
        }

        h2 {
            color: #22d3ee;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #22d3ee;
            color: #020617;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f7df1e;
        }

        .result {
            margin-top: 20px;
            padding: 22px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 18px;
            line-height: 2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>JavaScript Laboratory</h1>

    <h2>43. Fetch API</h2>

    <button onclick="getData()">Fetch Data</button>

    <div class="result" id="result">
        Click the button to fetch data
    </div>

</div>

<script>

    function getData() {

        fetch("https://jsonplaceholder.typicode.com/posts/1")

            .then(response => response.json())

            .then(data => {

                document.getElementById("result").innerHTML =
                    "Title: " + data.title +
                    "<br>Body: " + data.body;

            })

            .catch(error => {

                document.getElementById("result").innerHTML =
                    "Error fetching data";

            });
    }

</script>

</body>
</html>
