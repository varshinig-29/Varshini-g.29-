<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Common Elements</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background:
                radial-gradient(circle at top left, #172554, transparent 35%),
                radial-gradient(circle at bottom right, #3b0764, transparent 35%),
                #020617;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 750px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(34, 211, 238, 0.25);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: #f7df1e;
            margin-bottom: 12px;
        }

        h2 {
            color: #22d3ee;
            margin-bottom: 25px;
        }

        .result {
            padding: 22px;
            margin-top: 20px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 12px;
            font-size: 18px;
            line-height: 2;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 8px;
            border-radius: 8px;
            border: 1px solid #22d3ee;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #22d3ee;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f7df1e;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>JavaScript Program 60</h1>
    <h2>Common Elements in Two Arrays</h2>

    <input type="text" id="array1" placeholder="First array: 1,2,3,4">
    <input type="text" id="array2" placeholder="Second array: 3,4,5,6">

    <br>

    <button onclick="findCommon()">Find Common</button>

    <div class="result" id="output"></div>

</div>

<script>
function findCommon() {

    let arr1 = document.getElementById("array1").value
        .split(",")
        .map(Number);

    let arr2 = document.getElementById("array2").value
        .split(",")
        .map(Number);

    let common = arr1.filter(value => arr2.includes(value));

    common = [...new Set(common)];

    document.getElementById("output").innerHTML =
        "Common Elements: " + common.join(", ");
}
</script>

</body>
</html>
