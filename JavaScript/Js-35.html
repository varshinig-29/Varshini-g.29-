<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stopwatch</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;

            background:
                radial-gradient(circle at top left, #172554, transparent 35%),
                radial-gradient(circle at bottom right, #3b0764, transparent 35%),
                #020617;

            color: white;
        }

        .container {
            width: 90%;
            max-width: 750px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(34, 211, 238, 0.25);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: #f7df1e;
            margin-bottom: 12px;
        }

        h2 {
            color: #22d3ee;
            margin-bottom: 25px;
        }

        .result {
            padding: 30px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 40px;
            font-weight: bold;
        }

        button {
            padding: 12px 25px;
            margin: 15px 5px 0;
            border: none;
            border-radius: 8px;
            background: #22d3ee;
            color: #020617;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f7df1e;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>JavaScript Laboratory</h1>

        <h2>35. Stopwatch</h2>

        <div class="result" id="display">
            00:00:00
        </div>

        <button onclick="start()">Start</button>

        <button onclick="stop()">Stop</button>

        <button onclick="reset()">Reset</button>

    </div>

    <script>

        let seconds = 0;
        let timer;

        function start() {

            if (!timer) {

                timer = setInterval(function() {

                    seconds++;

                    let hours = Math.floor(seconds / 3600);
                    let minutes = Math.floor((seconds % 3600) / 60);
                    let secs = seconds % 60;

                    hours = String(hours).padStart(2, "0");
                    minutes = String(minutes).padStart(2, "0");
                    secs = String(secs).padStart(2, "0");

                    document.getElementById("display").innerHTML =
                        hours + ":" + minutes + ":" + secs;

                }, 1000);
            }
        }

        function stop() {

            clearInterval(timer);

            timer = null;
        }

        function reset() {

            clearInterval(timer);

            timer = null;

            seconds = 0;

            document.getElementById("display").innerHTML =
                "00:00:00";
        }

    </script>

</body>
</html>
